services:
  - type: web
    name: meeting-translator
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /
    envVars:
      # 以下密钥在 Render Dashboard 手动填，不入库
      - key: VOLC_API_KEY
        sync: false
      - key: AUTH_TOKEN
        sync: false
      # 翻译语种，有默认值，可按需改
      - key: SOURCE_LANG
        value: zh
      - key: TARGET_LANG
        value: en
